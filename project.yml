# CEO OS — Xcode project definition.
#
# The .xcodeproj is GENERATED from this file and is not committed. Regenerate with:
#     xcodegen generate
#
# Why: a hand-maintained project.pbxproj is unreadable, merge-hostile, and hides
# exactly the settings that matter here (App Group, CloudKit container,
# entitlements, background modes). This file is the reviewable source of truth.
# XcodeGen is a build-time tool only — nothing from it ships inside the app.

name: CEOOS

options:
  bundleIdPrefix: com.kambojventures
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    # Swift 5 language mode, deliberately. SwiftData's @Model classes are not
    # Sendable, and Swift 6 strict concurrency turns every ModelContext hop into
    # an error. We move to Swift 6 mode as a considered migration, not as a
    # first-build obstacle.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_MODULE_VERIFIER: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad. iPhone is what we design for.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  # ---------------------------------------------------------------- CEOOSKit
  # Every model, service, and integration lives here. The app, the widget, the
  # intents extension, and (later) the Watch app all depend on it. Nothing in
  # this framework imports SwiftUI beyond what a view model needs.
  CEOOSKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CEOOSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kambojventures.ceoos.kit
        INFOPLIST_FILE: Sources/CEOOSKit/Info.plist
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  # -------------------------------------------------------------------- App
  CEOOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/CEOOS
    dependencies:
      - target: CEOOSKit
        embed: true
      - target: CEOOSWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kambojventures.ceoos
        PRODUCT_NAME: CEO OS
        INFOPLIST_FILE: Sources/CEOOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/CEOOS/Resources/CEOOS.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"

  # ----------------------------------------------------------------- Widget
  # Minimal in this slice. Its job right now is to prove that an extension can
  # open the shared SwiftData store through the App Group — the one thing in
  # Phase 0 that is genuinely expensive to discover late.
  CEOOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/CEOOSWidgets
    dependencies:
      - target: CEOOSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kambojventures.ceoos.widgets
        INFOPLIST_FILE: Sources/CEOOSWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/CEOOSWidgets/CEOOSWidgets.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"

  # ------------------------------------------------------------------ Tests
  CEOOSKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CEOOSKitTests
    dependencies:
      - target: CEOOSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kambojventures.ceoos.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CEOOS:
    build:
      targets:
        CEOOS: all
        CEOOSKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CEOOSKitTests
